<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mhako Bhart Pay - हर पेमेंट, हर सेवा — एक जगह</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .navbar h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00d2ff;
        }

        .navbar p {
            font-size: 12px;
            color: #ccc;
            margin-top: 3px;
            font-style: italic;
        }

        /* Main Container */
        .container {
            flex: 1;
            max-width: 600px;
            width: 95%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c5364;
            font-size: 18px;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 10px;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        @media (max-width: 480px) {
            .services-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .service-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 5px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .service-box i {
            font-size: 22px;
            color: #475569;
            margin-bottom: 6px;
        }

        .service-box p {
            font-size: 11px;
            font-weight: 600;
            color: #475569;
        }

        .service-box.active {
            background: #e0f2fe;
            border-color: #0284c7;
        }

        .service-box.active i, .service-box.active p {
            color: #0284c7;
        }

        /* Form Styling */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            background: #fff;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        /* Pay Button */
        .btn-pay {
            width: 100%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-pay:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 239, 125, 0.4);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #64748b;
            background: #e2e8f0;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Navbar displaying Mhako Bhart Pay -->
    <div class="navbar">
        <h1>Mhako Bhart Pay</h1>
        <p>“हर पेमेंट, हर सेवा — एक जगह”</p>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h2 id="form-title">मोबाइल रिचार्ज</h2>

        <!-- Services Menu Grid -->
        <div class="services-grid">
            <div class="service-box active" onclick="switchService('mobile')">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <p>Mobile</p>
            </div>
            <div class="service-box" onclick="switchService('dth')">
                <i class="fa-solid fa-tv"></i>
                <p>DTH</p>
            </div>
            <div class="service-box" onclick="switchService('electricity')">
                <i class="fa-solid fa-lightbulb"></i>
                <p>Bijli</p>
            </div>
            <div class="service-box" onclick="switchService('broadband')">
                <i class="fa-solid fa-wifi"></i>
                <p>Broadband</p>
            </div>
            <div class="service-box" onclick="switchService('fastag')">
                <i class="fa-solid fa-car"></i>
                <p>FASTag</p>
            </div>
            <div class="service-box" onclick="switchService('money')">
                <i class="fa-solid fa-money-bill-transfer"></i>
                <p>Money</p>
            </div>
            <div class="service-box" onclick="switchService('aeps')">
                <i class="fa-solid fa-fingerprint"></i>
                <p>AEPS</p>
            </div>
            <div class="service-box" onclick="switchService('travel')">
                <i class="fa-solid fa-ticket"></i>
                <p>Travel</p>
            </div>
            <div class="service-box" onclick="switchService('portal')">
                <i class="fa-solid fa-user-tie"></i>
                <p>Portal</p>
            </div>
        </div>

        <!-- Dynamic Content Form -->
        <form id="mhakoPayForm">
            <!-- Account Number / Phone -->
            <div class="input-group">
                <label id="number-label" for="accountInput">मोबाइल नंबर दर्ज करें</label>
                <div class="input-wrapper">
                    <i id="number-icon" class="fa-solid fa-phone"></i>
                    <input type="number" id="accountInput" placeholder="10 अंकों का नंबर डालें" required>
                </div>
            </div>

            <!-- Operator Select -->
            <div class="input-group" id="operator-group">
                <label id="operator-label" for="operator">ऑपरेटर चुनें</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-building-columns"></i>
                    <select id="operator" required>
                        <option value="">-- चयन करें --</option>
                        <option value="Jio">Jio</option>
                        <option value="Airtel">Airtel</option>
                        <option value="Vi">Vi</option>
                        <option value="BSNL">BSNL</option>
                    </select>
                </div>
            </div>

            <!-- Amount Group -->
            <div class="input-group" id="amount-group">
                <label for="amount">राशि (₹ Amount)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                    <input type="number" id="amount" placeholder="रुपये दर्ज करें" min="10" required>
                </div>
            </div>

            <!-- Action Button tied to Razorpay -->
            <button type="button" class="btn-pay" onclick="handleAction()">
                <i class="fa-solid fa-shield-halved"></i> आगे बढ़ें
            </button>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 Mhako Bhart Pay. All Rights Reserved. "हर पेमेंट, हर सेवा — एक जगह"
    </div>

        <!-- Razorpay Scripts -->
    <script src="https://razorpay.com"></script>
    <script>
        let currentService = 'mobile';

        function switchService(service) {
            currentService = service;
            document.querySelectorAll('.service-box').forEach(box => box.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const formTitle = document.getElementById('form-title');
            const numberLabel = document.getElementById('number-label');
            const numberIcon = document.getElementById('number-icon');
            const inputField = document.getElementById('accountInput');
            const operatorGroup = document.getElementById('operator-group');
            const operatorLabel = document.getElementById('operator-label');
            const operatorSelect = document.getElementById('operator');
            const amountGroup = document.getElementById('amount-group');

            operatorGroup.style.display = "block";
            amountGroup.style.display = "block";

            if (service === 'mobile') {
                formTitle.innerText = "मोबाइल रिचार्ज";
                numberLabel.innerText = "मोबाइल नंबर दर्ज करें";
                numberIcon.className = "fa-solid fa-phone";
                inputField.placeholder = "10 अंकों का नंबर डालें";
                operatorSelect.innerHTML = `<option value="Jio">Jio</option><option value="Airtel">Airtel</option><option value="Vi">Vi</option><option value="BSNL">BSNL</option>`;
            } else if (service === 'dth') {
                formTitle.innerText = "DTH रिचार्ज";
                numberLabel.innerText = "DTH कस्टमर ID दर्ज करें";
                numberIcon.className = "fa-solid fa-tv";
                inputField.placeholder = "DTH कस्टमर ID डालें";
                operatorSelect.innerHTML = `<option value="TataPlay">Tata Play</option><option value="DishTV">Dish TV</option><option value="AirtelTV">Airtel Digital TV</option><option value="d2h">Videocon d2h</option>`;
            } else if (service === 'electricity') {
                formTitle.innerText = "बिजली बिल भुगतान";
                numberLabel.innerText = "उपभोक्ता संख्या (K Number)";
                numberIcon.className = "fa-solid fa-bolt";
                inputField.placeholder = "बिजली बिल अकाउंट नंबर डालें";
                operatorGroup.style.display = "none";
            } else if (service === 'broadband') {
                formTitle.innerText = "ब्रॉडबैंड बिल भुगतान";
                numberLabel.innerText = "अकाउंट नंबर / लैंडलाइन नंबर";
                numberIcon.className = "fa-solid fa-wifi";
                inputField.placeholder = "ब्रॉडबैंड अकाउंट नंबर डालें";
                operatorSelect.innerHTML = `<option value="BSNL">BSNL Broadband</option><option value="JioFiber">JioFiber</option><option value="AirtelXstream">Airtel Xstream</option>`;
            } else if (service === 'fastag') {
                formTitle.innerText = "FASTag रिचार्ज";
                numberLabel.innerText = "वाहन नंबर (Vehicle Number)";
                numberIcon.className = "fa-solid fa-car";
                inputField.placeholder = "उदाहरण: RJ46XX1234";
                operatorSelect.innerHTML = `<option value="SBI">SBI FASTag</option><option value="Paytm">Paytm FASTag</option><option value="HDFC">HDFC FASTag</option>`;
            } else if (service === 'money') {
                formTitle.innerText = "मनी ट्रांसफर";
                numberLabel.innerText = "बैंक खाता नंबर";
                numberIcon.className = "fa-solid fa-university";
                inputField.placeholder = "Account Number दर्ज करें";
                operatorLabel.innerText = "बैंक चुनें";
                operatorSelect.innerHTML = `<option value="SBI">State Bank of India</option><option value="BOB">Bank of Baroda</option><option value="PNB">Punjab National Bank</option>`;
            } else if (service === 'aeps') {
                formTitle.innerText = "AEPS (आधार भुगतान)";
                numberLabel.innerText = "आधार कार्ड नंबर";
                numberIcon.className = "fa-solid fa-fingerprint";
                inputField.placeholder = "12 अंकों का आधार नंबर डालें";
                operatorLabel.innerText = "लिंक बैंक चुनें";
                operatorSelect.innerHTML = `<option value="SBI">SBI</option><option value="BOB">BOB</option>`;
            } else if (service === 'travel') {
                formTitle.innerText = "टिकट बुकिंग";
                numberLabel.innerText = "कहाँ से (From)";
                numberIcon.className = "fa-solid fa-location-dot";
                inputField.placeholder = "शहर का नाम";
                operatorLabel.innerText = "कहाँ तक (To)";
                operatorSelect.innerHTML = `<option value="Delhi">Delhi</option><option value="Jaipur">Jaipur</option><option value="Ahmedabad">Ahmedabad</option>`;
            } else if (service === 'portal') {
                formTitle.innerText = "रिटेलर पोर्टल";
                numberLabel.innerText = "यूजर ID";
                numberIcon.className = "fa-solid fa-user";
                inputField.placeholder = "यूजर ID दर्ज करें";
                operatorGroup.style.display = "none";
                amountGroup.style.display = "none";
            }
        }

        function handleAction() {
            const inputVal = document.getElementById('accountInput').value;
            const amtVal = document.getElementById('amount').value;

            if (currentService === 'portal') {
                alert("पोर्टल लॉगिन सिस्टम को लाइव API से जोड़ा जाना बाकी है।");
                return;
            }

            if(!inputVal || (currentService !== 'travel' && !amtVal)) {
                alert("कृपया सभी आवश्यक बॉक्स भरें!");
                return;
            }

            // Razorpay Live Setup
            var options = {
                "key": "rzp_live_TVw3z0nKLpat5Q", 
                "amount": amtVal * 100, 
                "currency": "INR",
                "name": "Mhako Bhart Pay",
                "description": currentService.toUpperCase() + " Service",
                "image": "https://flaticon.com",
                "handler": function (response){
                    alert("भुगतान सफल रहा! ट्रांजैक्शन ID: " + response.razorpay_payment_id);
                },
                "theme": {
                    "color": "#2c5364"
                }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
        }
    </script>
</body>
</html>
